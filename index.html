<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GoDue helps you organize bills, track payment deadlines and manage recurring expenses.">
    <title>GoDue – Bill & Payment Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #090d0b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            max-width: 680px;
            text-align: center;
        }

        .brand {
            color: #00c853;
            font-size: 48px;
            font-weight: 750;
            margin-bottom: 12px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            margin: 0 0 16px;
        }

        p {
            color: #a9b5ad;
            font-size: 18px;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 24px;
            padding: 14px 26px;
            background: #00c853;
            color: #001b0b;
            text-decoration: none;
            font-weight: 650;
            border-radius: 12px;
        }

        footer {
            margin-top: 64px;
            color: #77827b;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">GoDue</div>

        <h1>Stay ahead of every payment.</h1>

        <p>
            GoDue is a simple bill and payment tracker that helps you
            organize expenses, remember due dates and manage recurring
            payments in one place.
        </p>

        <a class="button"
           href="https://apps.apple.com/us/app/godue/id6824180958">
            Get GoDue on the App Store
        </a>

        <footer>
            © 2026 Kannan R S. All rights reserved.
        </footer>
    </main>
</body>
</html>
